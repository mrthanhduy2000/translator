<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursera Translator</title>
    <link href="popup.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
            </svg>
            <h1>Dịch phụ đề sang Tiếng Việt</h1>
        </div>

        <div class="form-group">
            <p class="note">
                Hỗ trợ <strong>Coursera</strong> và <strong>YouTube</strong>. Phụ đề gốc ở bất kỳ ngôn ngữ nào sẽ được tự động
                nhận diện và dịch sang <strong>Tiếng Việt</strong>.
            </p>
        </div>

        <div class="form-group">
            <label class="checkbox-row">
                <input type="checkbox" id="dualMode">
                <span>Hiện song song cả phụ đề gốc</span>
            </label>
            <label class="checkbox-row">
                <input type="checkbox" id="perCueMode">
                <span>Dịch từng dòng riêng (khớp thời gian tuyệt đối, câu có thể cụt)</span>
            </label>
            <label class="checkbox-row sub-option">
                <input type="checkbox" id="styleOriginal">
                <span>Làm nhỏ và mờ dòng gốc cho dễ phân biệt</span>
            </label>
            <label class="checkbox-row sub-option">
                <input type="checkbox" id="originalFirst">
                <span>Đảo thứ tự: tiếng Anh ở trên, tiếng Việt ở dưới</span>
            </label>
        </div>

        <button id="translateBtn" class="button-primary">Bắt đầu dịch</button>
        <p id="status" class="status"></p>

        <button id="openOptions" class="button-secondary" style="width:100%;margin-top:8px;">
            Quản lý từ điển thuật ngữ
        </button>

        <div class="divider"><span>Liên kết</span></div>
        <div class="social-links">
            <a href="https://github.com/bombap/coursera-translator" target="_blank" rel="noopener noreferrer" class="button-secondary">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                GitHub
            </a>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
